[package]
name = "metron"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Compile-time SI units for Rust. Zero-cost dimensional analysis with pow! macro syntax."
keywords = ["units", "si", "dimensional-analysis", "physics", "no-std"]
categories = ["science", "no-std"]

[features]
default = ["std"]
std = ["serde/std", "nalgebra/std"]
serde = ["dep:serde"]

[dependencies]
nalgebra = { version = "0.34", default-features = false, features = ["libm"] }
num-complex = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
typenum = "1.20"

[dev-dependencies]
approx = "0.5"
